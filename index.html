<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonial Name Generator</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0b1017;
            --panel: #131d28;
            --border: #304654;
            --accent: #8bd5db;
            --text: #e2e9ed;
            --muted: #a1b1bd;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at top, #1a2b39, var(--background) 65%);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }
        main { width: 100%; max-width: 620px; }
        header { margin-bottom: 28px; }
        .eyebrow, label, dt {
            color: var(--muted);
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        h1 { color: var(--accent); font-size: clamp(1.5rem, 5vw, 2rem); margin: 8px 0; }
        header p { color: var(--muted); margin: 0; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        label { display: block; margin-bottom: 10px; }
        select, button {
            width: 100%;
            padding: 12px;
            font: inherit;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        select { background: var(--background); color: var(--text); }
        button {
            margin-top: 16px;
            background: var(--accent);
            color: var(--background);
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #b2e8ec; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        #emptyState { color: var(--muted); text-align: center; margin: 0; }
        dl { margin: 0; }
        .result-row {
            display: grid;
            grid-template-columns: minmax(110px, 35%) 1fr;
            gap: 12px;
            align-items: baseline;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .result-row:first-child { padding-top: 0; }
        .result-row:last-child { border-bottom: 0; padding-bottom: 0; }
        dd { margin: 0; overflow-wrap: anywhere; }
        #outAppears { color: var(--accent); font-size: 1.15rem; font-weight: 600; }
        #outGivenOrigin, #outSurnameOrigin { color: var(--muted); }
        footer { color: var(--muted); font: 0.7rem monospace; letter-spacing: 0.12em; }
        @media (max-width: 380px) {
            .panel { padding: 16px; }
            .result-row { grid-template-columns: 1fr; gap: 4px; }
        }
    </style>
    <!-- Load the two databases first, then the generator engine. -->
    <script src="names.js" defer></script>
    <script src="colonies.js" defer></script>
    <script src="generator.js" defer></script>
</head>
<body>
    <main>
        <header>
            <div class="eyebrow">Colonial registry / Personnel records</div>
            <h1>Colonial Name Generator</h1>
            <p>Generate names by colony bloc of origin.</p>
        </header>
        <section class="panel" aria-label="Generator controls">
            <label for="colonySelect">Colony bloc of origin</label>
            <!-- The engine automatically fills this menu from colonies.js. -->
            <select id="colonySelect"></select>
            <button id="generate" type="button">Generate Name</button>
        </section>
        <section class="panel" aria-label="Generated name" aria-live="polite">
            <p id="emptyState">Select a colony bloc and press Generate Name.</p>
            <div id="resultRows" style="display: none;">
                <dl>
                    <div class="result-row"><dt>Male</dt><dd id="outMale"></dd></div>
                    <div class="result-row"><dt>Female</dt><dd id="outFemale"></dd></div>
                    <div class="result-row"><dt>Surname</dt><dd id="outSurname"></dd></div>
                    <div class="result-row"><dt>Appears as</dt><dd id="outAppears"></dd></div>
                    <div class="result-row"><dt>Given origin</dt><dd id="outGivenOrigin"></dd></div>
                    <div class="result-row"><dt>Surname origin</dt><dd id="outSurnameOrigin"></dd></div>
                </dl>
            </div>
        </section>
        <noscript><p>Enable JavaScript to use the generator.</p></noscript>
        <footer>COLONIAL REGISTRY // NAME GENERATION TERMINAL</footer>
    </main>
</body>
</html>
